# filepath: /backend/src/main/resources/application.yml
# Konfigurasi bersama semua environment. Nilai per environment ada di:
#   application-local.yml  (default, untuk development)
#   application-prod.yml   (aktifkan dengan SPRING_PROFILES_ACTIVE=prod)
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: sakutahu
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    check-template-location: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # SMTP lambat/down tidak boleh membuat container dianggap mati
    mail:
      enabled: false

app:
  jwt:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  cookie:
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/v1/auth
  verification:
    token-ttl: PT24H
    unverified-account-retention: P7D
  security:
    max-failed-logins: 10
    lock-duration: PT15M
  telegram:
    link-token-ttl: PT10M
  receipt:
    provider: claude
    model: ${RECEIPT_AI_MODEL:claude-haiku-5-5}
    api-base-url: ${RECEIPT_AI_BASE_URL:https://api.anthropic.com}
    max-file-mb: ${RECEIPT_MAX_FILE_MB:7}
    timeout-seconds: 45
    # Isi bila API key tidak terikat ke satu workspace (error "anthropic-workspace-id header")
    workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
