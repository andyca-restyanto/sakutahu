# filepath: /docker-compose.prod.yml
# Production: Caddy (HTTPS + frontend) → backend (Spring Boot) → PostgreSQL NATIVE di host VPS.
#   1. cp .env.example .env                                         (domain & kredensial DB)
#   2. cp backend/.env.production.example backend/.env.production   (secret aplikasi)
#   3. bash deploy/scripts/deploy.sh
# PostgreSQL TIDAK berjalan di Docker: di-install langsung di VPS (apt, repo resmi PGDG),
# supaya bisa diakses dari luar dengan pembatasan IP lewat pg_hba.conf + UFW.
# Untuk development tetap pakai docker-compose.yml.
name: sakutahu

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build: ./backend
    image: sakutahu-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      # Koneksi DB diatur di sini (menimpa DB_* di backend/.env.production).
      # host.docker.internal = IP host VPS dilihat dari dalam container.
      DB_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-sakutahu}
      DB_USERNAME: ${POSTGRES_USER:-sakutahu_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      SPRING_PROFILES_ACTIVE: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Tidak ada "ports": backend hanya bisa diakses lewat Caddy
    logging: *logging

  web:
    build: ./frontend
    image: sakutahu-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Isi DOMAIN di file .env}
      ACME_EMAIL: ${ACME_EMAIL:?Isi ACME_EMAIL di file .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # sertifikat HTTPS, jangan dihapus
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        # Subnet tetap: dipakai di pg_hba.conf & UFW agar hanya container ini yang boleh ke PostgreSQL host
        - subnet: 172.28.0.0/16
